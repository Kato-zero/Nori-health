<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>NORI Dashboard</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>


body{

background:#fbf6f1;
font-family:Arial;
padding:40px;

}


.header{

display:flex;
justify-content:space-between;
align-items:center;

}


h1{

color:#7a3742;
letter-spacing:4px;

}



button{

background:#7a3742;
color:white;
border:none;
padding:12px 20px;
border-radius:25px;
cursor:pointer;

}



table{

margin-top:40px;
width:100%;
background:white;
border-radius:20px;
overflow:hidden;

}



td,th{

padding:18px;
text-align:left;

}


th{

background:#7a3742;
color:white;

}



</style>


</head>


<body>



<div class="header">


<h1>NORI CMS</h1>


<div>

<button onclick="createPost()">
+ New Article
</button>


<button onclick="logout()">
Logout
</button>

</div>


</div>




<h2>
Articles
</h2>


<table>


<thead>

<tr>

<th>
Title
</th>

<th>
Category
</th>

<th>
Status
</th>

<th>
Date
</th>

</tr>


</thead>


<tbody id="articles">

</tbody>


</table>






<script>


async function checkUser(){

const {data}=await db.auth.getUser();


if(!data.user){

window.location.href="login.html";

}


}


checkUser();





async function loadArticles(){


const {data,error}=await db
.from("articles")
.select("*")
.order("created_at",
{ascending:false});



let html="";


data.forEach(article=>{


html += `

<tr>

<td>${article.title}</td>

<td>${article.category}</td>

<td>${article.status}</td>

<td>
${new Date(article.created_at).toLocaleDateString()}
</td>


</tr>

`;

});


document.getElementById("articles").innerHTML=html;


}


loadArticles();





function createPost(){

window.location.href="create-post.html";

}





async function logout(){

await db.auth.signOut();

window.location.href="login.html";

}



</script>



</body>

</html>
