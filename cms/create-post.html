<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Article | NORI CMS</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

*{
    box-sizing:border-box;
}


body{

background:#fbf6f1;
font-family:Arial,sans-serif;
padding:40px;

}


.container{

max-width:900px;
margin:auto;

}



h1{

color:#7a3742;
letter-spacing:4px;

}



.card{

background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.08);

}



label{

display:block;
margin-top:20px;
font-weight:bold;

}


input,
textarea,
select{

width:100%;
padding:15px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;

}



textarea{

height:300px;
resize:vertical;

}



button{

margin-top:30px;
padding:15px 35px;
border:none;
border-radius:30px;
background:#7a3742;
color:white;
font-weight:bold;
cursor:pointer;

}



.back{

background:#eee;
color:#333;
margin-left:10px;

}



#message{

margin-top:20px;
font-weight:bold;

}


</style>


</head>



<body>



<div class="container">


<h1>
NORI CMS
</h1>


<div class="card">


<h2>
Create New Article
</h2>




<label>
Article Title
</label>

<input 
id="title"
placeholder="Example: Why Is My Period Late?">





<label>
Category
</label>


<select id="category">


<option>
Periods
</option>


<option>
Hormones
</option>


<option>
Nutrition
</option>


<option>
Weight Loss
</option>


<option>
Fitness
</option>


<option>
PCOS
</option>


</select>






<label>
Short Description
</label>


<textarea 
id="excerpt"
style="height:120px"
placeholder="Short article summary for cards and SEO">
</textarea>






<label>
Article Content
</label>


<textarea 
id="content"
placeholder="Write your article here...">
</textarea>






<label>
Featured Image URL
</label>


<input
id="image"
placeholder="https://example.com/image.jpg">






<label>
Status
</label>


<select id="status">


<option value="draft">
Draft
</option>


<option value="published">
Published
</option>


</select>






<button onclick="saveArticle()">

Publish Article

</button>



<button 
class="back"
onclick="goBack()">

Cancel

</button>



<p id="message"></p>



</div>


</div>







<script>



async function checkUser(){


const {data}=await db.auth.getUser();



if(!data.user){

window.location.href="login.html";

}


}



checkUser();








function createSlug(text){


return text
.toLowerCase()
.trim()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");


}








async function saveArticle(){



const title =
document.getElementById("title").value;


const category =
document.getElementById("category").value;


const excerpt =
document.getElementById("excerpt").value;


const content =
document.getElementById("content").value;


const image =
document.getElementById("image").value;


const status =
document.getElementById("status").value;




if(!title || !content){


document.getElementById("message").innerHTML =
"Please enter title and content";


return;


}






const article = {


title:title,


slug:createSlug(title),


excerpt:excerpt,


content:content,


featured_image:image,


category:category,


status:status,


author:"NORI Team"


};







const {data,error}=await db
.from("articles")
.insert([article]);






if(error){


document.getElementById("message").innerHTML =
error.message;


return;


}






document.getElementById("message").innerHTML =
"Article saved successfully ✔";




setTimeout(()=>{


window.location.href="dashboard.html";


},1500);




}







function goBack(){


window.location.href="dashboard.html";


}



</script>


</body>

</html>
